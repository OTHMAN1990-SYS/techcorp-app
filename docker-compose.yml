services:
  web:
    image: nginx:alpine
    container_name: techcorp_web
    ports:
      - "8080:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: techcorp_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: techcorp_grafana
    ports:
      - "3001:3000"
    restart: always
